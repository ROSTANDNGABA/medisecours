name: Keepalive Render

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Ping services
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "https://medisecours-backend.onrender.com/api/health" || echo 000)
          echo "backend: $(date -u +%H:%M:%S) HTTP $code"
          case "$code" in
            2*) echo "backend OK" ;;
            *) echo "backend down (HTTP $code)"; exit 1 ;;
          esac
      - name: Ping websocket
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "https://medisecours-ws.onrender.com/health" || echo 000)
          echo "websocket: $(date -u +%H:%M:%S) HTTP $code"
          case "$code" in
            2*) echo "websocket OK" ;;
            *) echo "websocket down (HTTP $code)"; exit 1 ;;
          esac
